<!DOCTYPE html>
<html>
<head>
    <title>Tangkap Makanan</title>
    <style>
        * {margin:0;padding:0;font-family:Arial;}
        body {background:#87CEEB;text-align:center;}

        /* MENU PILIH */
        #menu {padding-top:100px;}
        h1 {color:white;text-shadow:2px 2px 4px #333;margin-bottom:30px;}
        .btn {padding:12px 35px;margin:10px;font-size:18px;border:none;border-radius:8px;color:white;cursor:pointer;}
        .mudah {background:green;}
        .sedang {background:orange;}
        .sulit {background:red;}

        /* INFO ATAS */
        #info {display:none;background:#222;color:white;padding:8px;font-size:18px;}
        #info span {color:yellow;font-weight:bold;}

        /* AREA MAIN */
        #layar {display:none;width:900px;height:500px;background:linear-gradient(#87CEEB,#90EE90);margin:20px auto;position:relative;overflow:hidden;border:3px solid white;}
        #keranjang {position:absolute;bottom:10px;left:400px;font-size:60px;}
        .jatuh {position:absolute;font-size:40px;}
        #pesan {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:yellow;padding:20px;font-size:24px;display:none;}
    </style>
</head>
<body>

<!-- MENU AWAL -->
<div id="menu">
    <h1>🧺 TANGKAP MAKANAN</h1>
    <button class="btn mudah" onclick="mulai(3,1200)">🟢 MUDAH</button>
    <button class="btn sedang" onclick="mulai(5,900)">🟠 SEDANG</button>
    <button class="btn sulit" onclick="mulai(7,600)">🔴 SULIT</button>
    <p style="margin-top:15px;color:white;">Gunakan ⬅️➡️ untuk gerakkan keranjang</p>
</div>

<div id="info">
    Nyawa: <span id="nyawa">❤️❤️❤️</span> |
    Skor: <span id="skor">0</span> |
    Level: <span id="level">1</span> / 10
</div>

<div id="layar">
    <div id="keranjang">🧺</div>
    <div id="pesan"></div>
</div>

<script>
const menu = document.getElementById('menu');
const info = document.getElementById('info');
const layar = document.getElementById('layar');
const keranjang = document.getElementById('keranjang');
const pesan = document.getElementById('pesan');
const elNyawa = document.getElementById('nyawa');
const elSkor = document.getElementById('skor');
const elLevel = document.getElementById('level');

let jalan, kecepatan, jedaJatuh, skor, level, nyawa, arah;
let tombol = {};

// DAFTAR BARANG
const makanan = ['🍎','🍌','🍇','🍊','🍞','🧀','🍗','🍕'];
const sampah = ['👟','🧦','📱','💣','🪨'];

document.addEventListener('keydown',e=>tombol[e.key]=true);
document.addEventListener('keyup',e=>tombol[e.key]=false);

function mulai(k,j){
    menu.style.display='none';
    info.style.display='block';
    layar.style.display='block';

    kecepatan = k;
    jedaJatuh = j;
    skor = 0;
    level = 1;
    nyawa = 3;
    arah = 420;
    jalan = true;

    updateInfo();
    main();
    setInterval(buatBarang, jedaJatuh);
}

function updateInfo(){
    elSkor.innerText = skor;
    elLevel.innerText = level;
    elNyawa.innerText = '❤️'.repeat(nyawa);
}

function tampil(t){
    pesan.innerText = t;
    pesan.style.display = 'block';
    setTimeout(()=>location.reload(),3000);
}

function naikLevel(){
    level++;
    if(level>10){
        jalan=false;
        tampil('🎉 SELAMAT! KAMU MENYELESAIKAN SEMUA LEVEL!');
    }else{
        kecepatan += 0.6;
        jedaJatuh = Math.max(300, jedaJatuh - 80);
        updateInfo();
    }
}

function buatBarang(){
    if(!jalan) return;
    const b = document.createElement('div');
    b.className = 'jatuh';
    b.style.left = (50 + Math.random()*800) + 'px';
    b.style.top = '-50px';

    // 70% makanan, 30% sampah
    if(Math.random() < 0.7){
        b.innerText = makanan[Math.floor(Math.random()*makanan.length)];
        b.dataset.jenis = 'bagus';
    }else{
        b.innerText = sampah[Math.floor(Math.random()*sampah.length)];
        b.dataset.jenis = 'buruk';
    }

    layar.appendChild(b);
    gerakBarang(b);
}

function gerakBarang(el){
    const gerak = setInterval(()=>{
        if(!jalan) {clearInterval(gerak); return;}
        let y = parseFloat(el.style.top);
        y += kecepatan;
        el.style.top = y + 'px';

        // POSISI KERANJANG
        let kiri = arah;
        let kanan = arah + 60;

        // TERANGKAP
        if(y >= 440 && y <= 490){
            let x = parseFloat(el.style.left);
            if(x > kiri && x < kanan){
                el.remove();
                clearInterval(gerak);
                if(el.dataset.jenis == 'bagus'){
                    skor += 10;
                    if(skor % 50 == 0) naikLevel();
                }else{
                    nyawa--;
                    if(nyawa <= 0){
                        jalan = false;
                        tampil(`💀 GAME OVER! Skor akhir: ${skor}`);
                    }
                }
                updateInfo();
            }
        }

        // JATUH KE BAWAH TANPA TERANGKAP
        if(y > 520){
            el.remove();
            clearInterval(gerak);
            if(el.dataset.jenis == 'bagus'){
                nyawa--;
                if(nyawa <= 0){
                    jalan = false;
                    tampil(`💀 GAME OVER! Skor akhir: ${skor}`);
                }
                updateInfo();
            }
        }
    }, 30);
}

// GERAK KERANJANG
function main(){
    if(!jalan) return;
    if(tombol['ArrowLeft'] && arah > 10) arah -= 8;
    if(tombol['ArrowRight'] && arah < 830) arah += 8;
    keranjang.style.left = arah + 'px';
    requestAnimationFrame(main);
}
</script>
</body>
</html>
