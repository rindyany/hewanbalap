<!DOCTYPE html>
<html>
<head>
    <title>Hewan Balap Lengkap</title>
    <style>
        * { margin:0; padding:0; font-family:Arial; box-sizing:border-box; }
        body { background:#87CEEB; }
        #menu { text-align:center; padding-top:80px; }
        #menu h1 { margin-bottom:30px; color:white; text-shadow:2px 2px 4px #333; }
        .btn { padding:12px 30px; margin:8px; font-size:18px; border:none; border-radius:8px; cursor:pointer; color:white; }
        .mudah { background:green; }
        .sedang { background:orange; }
        .sulit { background:red; }
        #ui { display:none; background:rgba(0,0,0,0.7); color:white; padding:10px; text-align:center; font-size:18px; }
        #arena { display:none; width:900px; height:400px; background:linear-gradient(#90EE90,#228B22); margin:20px auto; border:3px solid white; position:relative; overflow:hidden; }
        .karakter { position:absolute; font-size:45px; line-height:1; }
        #p1 { top:80px; left:20px; }
        #p2 { top:180px; left:20px; }
        #musuh { top:280px; left:20px; }
        #garis { position:absolute; right:60px; top:0; height:100%; width:3px; border-left:3px dashed white; }
        #notif { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:yellow; padding:20px 30px; font-size:26px; display:none; border-radius:10px; text-align:center; }
    </style>
</head>
<body>

<div id="menu">
    <h1>🏁 PILIH TINGKATAN</h1>
    <button class="btn mudah" onclick="mulai('mudah')">🟢 MUDAH</button>
    <button class="btn sedang" onclick="mulai('sedang')">🟠 SEDANG</button>
    <button class="btn sulit" onclick="mulai('sulit')">🔴 SULIT</button>
</div>

<div id="ui">
    Waktu: <span id="waktu">30</span> detik | Level: <span id="level">1</span>
</div>

<div id="arena">
    <div id="p1" class="karakter">🐇</div>
    <div id="p2" class="karakter">🐢</div>
    <div id="musuh" class="karakter">🐺</div>
    <div id="garis"></div>
    <div id="notif"></div>
</div>

<script>
const menu = document.getElementById('menu');
const ui = document.getElementById('ui');
const arena = document.getElementById('arena');
const p1 = document.getElementById('p1');
const p2 = document.getElementById('p2');
const musuh = document.getElementById('musuh');
const waktuEl = document.getElementById('waktu');
const levelEl = document.getElementById('level');
const notif = document.getElementById('notif');

let waktu = 30, level = 1, jalanTerus = true;
let pos1 = 20, pos2 = 20, posMusuh = 20;
let tombol = {};
let kecepatanAwal, kecepatanMusuhAwal;

document.addEventListener('keydown', e => tombol[e.key] = true);
document.addEventListener('keyup', e => tombol[e.key] = false);

function bunyi(link) { try { new Audio(link).play() } catch(e) {} }
function info(pesan) { notif.innerText = pesan; notif.style.display = 'block'; setTimeout(() => notif.style.display = 'none', 2500); }

function mulai(pilih) {
    menu.style.display = 'none';
    ui.style.display = 'block';
    arena.style.display = 'block';
    if(pilih == 'mudah') { kecepatanAwal=5; kecepatanMusuhAwal=1.5; waktu=40; }
    if(pilih == 'sedang') { kecepatanAwal=4; kecepatanMusuhAwal=2.5; waktu=30; }
    if(pilih == 'sulit') { kecepatanAwal=3.5; kecepatanMusuhAwal=3.5; waktu=25; }
    waktuEl.innerText = waktu;
    setInterval(hitungWaktu,1000);
    mainGame();
}

function hitungWaktu() {
    if(!jalanTerus) return;
    waktu--; waktuEl.innerText = waktu;
    if(waktu<=0) { jalanTerus=false; info("⏰ Waktu Habis!"); setTimeout(()=>location.reload(),3000); }
}

function cekMenang() {
    if(pos1 >= 840) { jalanTerus=false; info("🎉 PEMAIN 1 MENANG!"); bunyi('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'); setTimeout(naikLevel,2500); }
    if(pos2 >= 840) { jalanTerus=false; info("🎉 PEMAIN 2 MENANG!"); bunyi('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'); setTimeout(naikLevel,2500); }
    if(posMusuh >= 840) { jalanTerus=false; info("💀 Serigala Menang!"); bunyi('https://assets.mixkit.co/sfx/preview/mixkit-player-losing-or-failing-2042.mp3'); setTimeout(()=>location.reload(),3000); }
}

function naikLevel() {
    level++; levelEl.innerText=level; waktu+=10; pos1=pos2=posMusuh=20; jalanTerus=true;
}

function mainGame() {
    if(!jalanTerus) return;
    if(tombol['ArrowRight']) pos1 += kecepatanAwal + (level*0.2);
    if(tombol['l'] || tombol['L']) pos2 += kecepatanAwal - 0.5 + (level*0.2);
    posMusuh += kecepatanMusuhAwal + (level*0.3);
    p1.style.left=pos1+'px'; p2.style.left=pos2+'px'; musuh.style.left=posMusuh+'px';
    cekMenang();
    requestAnimationFrame(mainGame);
}
</script>
</body>
</html>
