<!DOCTYPE html>
<html>
<head>
    <title>Tangkap Makanan - Tema Pink Rose</title>
    <style>
        * {margin:0;padding:0;font-family:Arial;}
        body {background:linear-gradient(#FFE4E1,#FFC0CB);text-align:center;position:relative;overflow:hidden;}

        /* GELEMBUNG HIASAN */
        .gelembung {position:absolute;border-radius:50%;background:rgba(255,255,255,0.3);animation:naik 8s infinite ease-in-out;}
        @keyframes naik {
            0% {transform:translateY(100vh);opacity:0.5;}
            100% {transform:translateY(-50px);opacity:0;}
        }

        /* MENU PILIH */
        #menu {padding-top:80px;position:relative;z-index:10;}
        h1 {color:#C71585;text-shadow:2px 2px 4px rgba(199,21,133,0.3);margin-bottom:25px;font-size:42px;}
        .btn {padding:12px 35px;margin:10px;font-size:18px;border:none;border-radius:20px;color:white;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        .mudah {background:#FF69B4;}
        .sedang {background:#FF1493;}
        .sulit {background:#C71585;}
        .btn:hover {transform:scale(1.05);}

        /* KETERANGAN DI TENGAH BAWAH */
        .info-permainan {margin-top:15px;padding:12px;background:rgba(255,255,255,0.75);border-radius:15px;display:inline-block;}
        .judul-aturan {color:#C71585;font-weight:bold;font-size:17px;margin-bottom:5px;}
        .isi-aturan {color:#333;font-size:15px;line-height:1.5;}

        /* INFO ATAS */
        #info {display:none;background:rgba(199,21,133,0.8);color:white;padding:8px;font-size:18px;border-radius:8px;margin:5px;}
        #info span {color:#FFE4E1;font-weight:bold;}

        /* AREA MAIN */
        #layar {display:none;width:900px;height:500px;background:linear-gradient(#FFE4E1,#FFC0CB);margin:20px auto;position:relative;overflow:hidden;border:3px solid #FF69B4;border-radius:12px;box-shadow:0 0 15px rgba(255,105,180,0.3);}
        /* KERANJANG DIPERBESAR */
        #keranjang {position:absolute;bottom:10px;left:400px;font-size:80px;}
        .jatuh {position:absolute;font-size:40px;}
        #pesan {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(199,21,133,0.9);color:#FFE4E1;padding:25px;font-size:24px;display:none;border-radius:12px;border:2px solid #FF69B4;}
    </style>
</head>
<body>

<!-- BUAT GELEMBUNG OTOMATIS -->
<script>
for(let i=0;i<20;i++){
    let g = document.createElement('div');
    g.className='gelembung';
    g.style.width = g.style.height = (10+Math.random()*30)+'px';
    g.style.left = (Math.random()*100)+'%';
    g.style.animationDelay = (Math.random()*8)+'s';
    document.body.appendChild(g);
}
</script>

<!-- MENU AWAL -->
<div id="menu">
    <h1>🧺 TANGKAP MAKANAN</h1>
    <button class="btn mudah" onclick="mulai(3,1200)">🟢 MUDAH</button>
    <button class="btn sedang" onclick="mulai(5,900)">🟠 SEDANG</button>
    <button class="btn sulit" onclick="mulai(7,600)">🔴 SULIT</button>

    <!-- KETERANGAN DI TENGAH BAWAH -->
    <div class="info-permainan">
        <p class="judul-aturan">❌ YANG TIDAK BOLEH DITANGKAP:</p>
        <p class="isi-aturan">👟 Sepatu 🧦 Kaos Kaki 📱 HP Rusak 💣 Bom 🪨 Batu</p>
    </div>

    <p style="margin-top:15px;color:#C71585;">Gunakan ⬅️➡️ untuk gerakkan keranjang</p>
</div>

<div id="info">
    Nyawa: <span id="nyawa">❤️❤️❤️❤️❤️</span> |
    Skor: <span id="skor">0</span> |
    Level: <span id="level">1</span> / 10
</div>

<div id="layar">
    <div id="keranjang">🧺</div>
    <div id="pesan"></div>
</div>

<script>
const menu = document.getElementById('menu');
const info = document.getElementById('info');
const layar = document.getElementById('layar');
const keranjang = document.getElementById('keranjang');
const pesan = document.getElementById('pesan');
const elNyawa = document.getElementById('nyawa');
const elSkor = document.getElementById('skor');
const elLevel = document.getElementById('level');

let jalan, kecepatan, jedaJatuh, skor, level, nyawa, arah;
let tombol = {};

const makanan = ['🍎','🍌','🍇','🍊','🍞','🧀','🍗','🍕'];
const sampah = ['👟','🧦','📱','💣','🪨'];

// FUNGSI SUARA YANG JELAS
function bunyi(url){try{new Audio(url).play()}catch(err){console.log("Suara siap diputar")}}
function bunyiBenar(){bunyi('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3')}
function bunyiSalah(){bunyi('https://assets.mixkit.co/sfx/preview/mixkit-retro-arcade-game-over-470.mp3')}
function bunyiNaik(){bunyi('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3')}

document.addEventListener('keydown',e=>tombol[e.key]=true);
document.addEventListener('keyup',e=>tombol[e.key]=false);

function mulai(k,j){
    menu.style.display='none';
    info.style.display='block';
    layar.style.display='block';
    kecepatan = k; jedaJatuh = j; skor = 0; level = 1; nyawa = 5; arah = 400; jalan = true;
    updateInfo(); main(); setInterval(buatBarang, jedaJatuh);
}

function updateInfo(){
    elSkor.innerText = skor; elLevel.innerText = level; elNyawa.innerText = '❤️'.repeat(nyawa);
}

function tampil(t){pesan.innerText=t;pesan.style.display='block';setTimeout(()=>location.reload(),3500)}

function naikLevel(){
    level++;
    if(level>10){jalan=false;bunyiNaik();tampil('🎉 SELAMAT! KAMU MENANG SAMPAI LEVEL 10!');}
    else{kecepatan+=0.6;jedaJatuh=Math.max(300,jedaJatuh-80);bunyiNaik();updateInfo();}
}

function buatBarang(){
    if(!jalan) return;
    const b = document.createElement('div');
    b.className='jatuh'; b.style.left=(50+Math.random()*800)+'px'; b.style.top='-50px';
    if(Math.random()<0.7){b.innerText=makanan[Math.floor(Math.random()*makanan.length)];b.dataset.jenis='bagus';}
    else{b.innerText=sampah[Math.floor(Math.random()*sampah.length)];b.dataset.jenis='buruk';}
    layar.appendChild(b); gerakBarang(b);
}

function gerakBarang(el){
    const gerak=setInterval(()=>{
        if(!jalan){clearInterval(gerak);return;}
        let y=parseFloat(el.style.top);y+=kecepatan;el.style.top=y+'px';
        let kiri=arah - 20; // AREA TANGKAP DIPERLUAS
        let kanan=arah + 100; // AREA TANGKAP DIPERLUAS

        if(y>=440&&y<=490){
            let x=parseFloat(el.style.left);
            if(x>kiri&&x<kanan){
                el.remove();clearInterval(gerak);
                if(el.dataset.jenis=='bagus'){skor+=10;bunyiBenar();if(skor%50==0)naikLevel();}
                else{nyawa--;bunyiSalah();if(nyawa<=0){jalan=false;tampil(`💀 GAME OVER! Skor: ${skor}`);}}
                updateInfo();
            }
        }

        if(y>520){
            el.remove();clearInterval(gerak);
            if(el.dataset.jenis=='bagus'){nyawa--;bunyiSalah();if(nyawa<=0){jalan=false;tampil(`💀 GAME OVER! Skor: ${skor}`);}}
            updateInfo();
        }
    },30);
}

function main(){
    if(!jalan)return;
    if(tombol['ArrowLeft']&&arah>10)arah-=8;
    if(tombol['ArrowRight']&&arah<800)arah+=8;
    keranjang.style.left=arah+'px';
    requestAnimationFrame(main);
}
</script>
</body>
</html>
